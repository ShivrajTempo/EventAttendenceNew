<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Account Access</title>
    <link rel="stylesheet" href="loginStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="container">

    <h2>Login to your account</h2>

    <form id="login" action="http://localhost:8080/users/login" method="POST">
        <div class="input-group">
            <label for="userId">USER ID</label>
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="userId" name="userId" placeholder="Enter your user ID" required>
            <div class="error" id="userIdError">Please enter a valid user ID</div>

        </div>
        <!-- ROLE -->
        <div class="input-group">
            <label for="role">Select Role</label>
            <i class="fas fa-user-tag input-icon"></i>
            <select id="role" name="role" required onchange="showExtraFields()">
                <option value="" disabled selected>Select your role</option>
                <option value="STUDENT">STUDENT</option>
                <option value="ADMIN">ADMIN</option>
                <option value="FACULTY">FACULTY</option>
            </select>
            <div class="error" id="roleError">Please select your role</div>
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <i class="fas fa-eye password-toggle" id="passwordToggle"></i>
            <div class="error" id="passwordError">Password is required</div>
        </div>

        <div class="forgot-password">
            <a href="#">Forgot password?</a>
        </div>

        <button type="submit">Log In</button>
    </form>
</div>
</body>
</html>
